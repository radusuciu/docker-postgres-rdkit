name: Build images

# One workflow; ordering expressed with needs: (SPEC R6). workflow_run is not
# used: it runs against the default branch rather than the triggering commit,
# fires on completed regardless of conclusion, and has no wait primitive.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.rdkit-core'
      - 'enable_extension.sql'
      - 'versions.json'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    # Daily. The cost tracks upstream's rebuild cadence, not the cron interval
    # (SPEC R6); daily buys the shortest patch-pickup lag at no extra cost.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      postgres:
        description: 'PostgreSQL major (17) or point release (17.11)'
        required: true
        type: string
      rdkit:
        description: 'RDKit release tag suffix, e.g. 2023_09_6'
        required: true
        type: string
      debian:
        description: 'Debian suite; defaults to versions.json'
        required: false
        type: string
      push:
        description: 'Push the resulting image'
        required: false
        type: boolean
        default: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/postgres-rdkit

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    # Ruling 26: without this, the job inherits the repository default, which
    # may not grant packages:read. This job logs in to GHCR and runs `docker
    # manifest inspect` for the R6 rebuild-avoidance check, and
    # resolve_matrix.sh treats ANY `docker manifest inspect` failure as "not
    # built" -- so a silent authorization failure here is indistinguishable
    # from a missing tag, and the workflow would rebuild the ENTIRE matrix on
    # every run while looking green. This permissions block is what keeps
    # that failure mode from being silent.
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      empty: ${{ steps.resolve.outputs.empty }}
      latest_pair: ${{ steps.resolve.outputs.latest_pair }}
      # The matrix's single default suite (Ruling 36). Computed once here,
      # not re-derived from versions.json inside the build job, because this
      # is where matrix facts already get computed.
      default_debian: ${{ steps.resolve.outputs.default_debian }}
      # R7: distinct {rdkit, debian} pairs, one rdkit-core image needed per
      # entry -- always a subset of `matrix`'s cardinality (often much
      # smaller, since one core image serves every PostgreSQL major).
      cores: ${{ steps.resolve.outputs.cores }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve entries and drop already-built pairs
        id: resolve
        env:
          IMAGE_REPO: ${{ env.IMAGE }}
          DISPATCH_POSTGRES: ${{ inputs.postgres }}
          DISPATCH_RDKIT: ${{ inputs.rdkit }}
          DISPATCH_DEBIAN: ${{ inputs.debian }}
        run: |
          set -euo pipefail
          matrix=$(scripts/resolve_matrix.sh)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "latest_pair=$(scripts/matrix.py --format latest)" >> "$GITHUB_OUTPUT"
          echo "default_debian=$(scripts/matrix.py --format debian)" >> "$GITHUB_OUTPUT"
          echo "cores=$(scripts/resolve_matrix.sh --cores)" >> "$GITHUB_OUTPUT"

          count=$(printf '%s' "$matrix" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$count" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to build: every entry's build key already exists."
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            printf '%s' "$matrix" | python3 -m json.tool
          fi

  # R7: one PostgreSQL-independent RDKit compile per distinct {rdkit_version,
  # debian} (R6 job structure item 2), shared by every PostgreSQL major the
  # `build` job below builds for that pair. Runs between resolve-matrix and
  # build so build's builder stage can COPY --from= it via `rdkit_core_image`.
  build-rdkit-core:
    needs: resolve-matrix
    if: needs.resolve-matrix.outputs.empty == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve-matrix.outputs.cores) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rdkit-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rdkit-core
          target: rdkit-core
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ghcr.io/${{ github.repository }}/rdkit-core:${{ matrix.entry.rdkit }}-${{ matrix.entry.debian }}
          build-args: |
            debian_version=${{ matrix.entry.debian }}
            rdkit_version=${{ matrix.entry.rdkit }}
          cache-from: type=gha,scope=core-${{ matrix.entry.debian }}-${{ matrix.entry.rdkit }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.entry.debian }}-${{ matrix.entry.rdkit }}

  build:
    needs: [resolve-matrix, build-rdkit-core]
    if: needs.resolve-matrix.outputs.empty == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}
    env:
      # R7: the rdkit-core image build-rdkit-core just pushed for this entry's
      # {rdkit, debian}. The builder stage's `rdkit_core_image` ARG (default
      # points at this same GHCR path, so a bare `docker build .` still
      # resolves, just requires a network pull) is overridden with this
      # explicit value below so the tag matches exactly what was just built,
      # not whatever the ARG default's own rdkit_version/debian_version
      # happen to be.
      CORE_IMAGE: ghcr.io/${{ github.repository }}/rdkit-core:${{ matrix.entry.rdkit }}-${{ matrix.entry.debian }}
      # Per-entry cache scope. The Actions cache is 10 GB per repository and is
      # evicted LRU, so concurrent matrix jobs writing mode=max to a SHARED
      # scope evict each other and can be worse than no cache at all (SPEC R6).
      CACHE_SCOPE: ${{ matrix.entry.debian }}-${{ matrix.entry.postgres_major }}-${{ matrix.entry.rdkit }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded into the local daemon so the smoke test can run before anything
      # is pushed (R8).
      #
      # No `no-cache-filters: builder` here (removed by R7, C4): the hazard
      # that flag used to guard against was the `RUN --mount=type=cache,
      # id=rdkit-build-...` mount that `make`/`make install`/`pgsql_install.sh`
      # populated -- daemon-local cache-mount state that `cache-from:
      # type=gha` could never restore, so a *layer*-cache hit on those steps
      # could leave the mount empty while the layer cache said "done". R7
      # removes that mount entirely: ${build_dir} now arrives via `COPY
      # --from=rdkit-core-provider` and every later RUN's output is a normal
      # image layer, so a `cache-from` layer hit and the files it produced
      # are now the same thing -- there is no separate mount state left to
      # fall out of sync. Forcing `builder` to always re-run would only cost
      # time for no remaining correctness benefit.
      - name: Build runtime image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: local/postgres-rdkit:candidate
          build-args: |
            debian_version=${{ matrix.entry.debian }}
            postgres_major_version=${{ matrix.entry.postgres_major }}
            postgres_point_version=${{ matrix.entry.postgres_point }}
            postgres_base_image=${{ matrix.entry.postgres_base_image }}
            postgres_base_digest=${{ matrix.entry.postgres_base_digest }}
            rdkit_version=${{ matrix.entry.rdkit }}
            rdkit_core_image=${{ env.CORE_IMAGE }}
            vcs_ref=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Export source-derived label values
        uses: docker/build-push-action@v6
        with:
          context: .
          target: label-values-export
          outputs: type=local,dest=./label-out
          build-args: |
            debian_version=${{ matrix.entry.debian }}
            postgres_major_version=${{ matrix.entry.postgres_major }}
            postgres_base_image=${{ matrix.entry.postgres_base_image }}
            rdkit_version=${{ matrix.entry.rdkit }}
            rdkit_core_image=${{ env.CORE_IMAGE }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      # Ruling 27: an unguarded `cat` here would let an empty or truncated
      # labels.env silently produce empty rdkit_pickle_version /
      # rdkit_cartridge_version / boost_version build args for the PUSHED
      # image while the job stays green (SPEC acceptance criterion 5 requires
      # those labels present and non-empty). Mirrors the `test -s
      # /tmp/runtime-packages.txt` guard the Dockerfile's runtime stage
      # already applies to the same class of bug.
      - name: Read label values
        id: labels
        run: |
          set -euo pipefail
          test -s ./label-out/labels.env || {
            echo "ERROR: label-out/labels.env is missing or empty" >&2
            exit 1
          }
          cat ./label-out/labels.env
          for key in rdkit_pickle_version rdkit_cartridge_version boost_version; do
            value=$(sed -n "s/^${key}=//p" ./label-out/labels.env)
            if [ -z "${value}" ]; then
              echo "ERROR: ${key} is missing or empty in labels.env" >&2
              exit 1
            fi
          done
          cat ./label-out/labels.env >> "$GITHUB_OUTPUT"

      - name: Run the build-stage test suite
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test-build
          build-args: |
            debian_version=${{ matrix.entry.debian }}
            postgres_major_version=${{ matrix.entry.postgres_major }}
            postgres_base_image=${{ matrix.entry.postgres_base_image }}
            rdkit_version=${{ matrix.entry.rdkit }}
            rdkit_core_image=${{ env.CORE_IMAGE }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      # Guards against a runtime dependency that was present at build time but
      # not shipped -- exactly the failure mode R3's minimization can introduce.
      - name: Run the runtime-stage test suite
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test-runtime
          build-args: |
            debian_version=${{ matrix.entry.debian }}
            postgres_major_version=${{ matrix.entry.postgres_major }}
            postgres_base_image=${{ matrix.entry.postgres_base_image }}
            rdkit_version=${{ matrix.entry.rdkit }}
            rdkit_core_image=${{ env.CORE_IMAGE }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Functional smoke test
        run: scripts/smoke_test.sh local/postgres-rdkit:candidate

      - name: Report image size
        # Observational only; nothing fails on it (SPEC R3). `docker pull` is
        # a live Docker Hub call under `bash -eo pipefail` (GitHub Actions'
        # default for `run:` steps), so without continue-on-error a Docker
        # Hub rate limit or blip here would abort the job at this line --
        # discarding a build that already passed compile, test-build,
        # test-runtime and the R8 smoke test, before "Compute tags" and
        # "Build and push" ever run -- for a reason unrelated to whether the
        # image is correct (Ruling 38). Kept rather than dropped: buildx does
        # not necessarily populate the local daemon's image store with the
        # base image, so removing the pull could make the size report
        # silently wrong instead of just occasionally skipped.
        continue-on-error: true
        run: |
          docker image inspect local/postgres-rdkit:candidate --format 'built: {{.Size}} bytes'
          docker pull -q "${{ matrix.entry.postgres_base_image }}"
          docker image inspect "${{ matrix.entry.postgres_base_image }}" --format 'base:  {{.Size}} bytes'

      - name: Compute tags
        id: tags
        env:
          IS_CURRENT: ${{ matrix.entry.postgres_is_current }}
          LATEST_PAIR: ${{ needs.resolve-matrix.outputs.latest_pair }}
          PG_MAJOR: ${{ matrix.entry.postgres_major }}
          PG_POINT: ${{ matrix.entry.postgres_point }}
          RDKIT: ${{ matrix.entry.rdkit }}
          BUILD_KEY: ${{ matrix.entry.build_key }}
          SUITE: ${{ matrix.entry.debian }}
          DEFAULT_DEBIAN: ${{ needs.resolve-matrix.outputs.default_debian }}
        run: |
          set -euo pipefail
          tags=""
          add() { tags="${tags}${tags:+$'\n'}${IMAGE}:$1"; }

          if [ "${SUITE}" = "${DEFAULT_DEBIAN}" ]; then
            # Default suite: the automatic matrix's own tags, unchanged.

            # Effectively immutable: the reproducible pin.
            add "postgres-${PG_POINT}-rdkit-${RDKIT}"
            # Immutable: dedup / provenance.
            add "postgres-${PG_MAJOR}-rdkit-${RDKIT}-${BUILD_KEY}"

            # Moving tags MUST NOT move backwards (SPEC R4): an on-demand build
            # of an older point release must not re-point the major tag at it.
            if [ "${IS_CURRENT}" = "true" ]; then
              add "postgres-${PG_MAJOR}-rdkit-${RDKIT}"
              latest_major=$(printf '%s' "${LATEST_PAIR}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["postgres_major"])')
              latest_rdkit=$(printf '%s' "${LATEST_PAIR}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["rdkit"])')
              if [ "${PG_MAJOR}" = "${latest_major}" ] && [ "${RDKIT}" = "${latest_rdkit}" ]; then
                add "latest"
              fi
            fi
          else
            # Non-default suite (Ruling 36, owner-directed, amends SPEC R4's
            # tag shape): only reachable via workflow_dispatch's `debian`
            # input, since the automatic matrix stays single-suite. Emit
            # exactly two tags and nothing else -- no moving major tag, no
            # `latest` -- so an on-demand build of a different suite can never
            # clobber a tag the automatic matrix owns. Same conservatism SPEC
            # 7a already applies to on-demand older point releases.
            add "postgres-${PG_POINT}-rdkit-${RDKIT}-${SUITE}"
            # No suite suffix needed here: build_key.sh already hashes
            # `debian` (plus file hashes, rdkit and base_digest), so a
            # different suite already yields a different build_key and
            # therefore a different tag. That also means R6's
            # rebuild-avoidance check is already suite-correct as-is.
            add "postgres-${PG_MAJOR}-rdkit-${RDKIT}-${BUILD_KEY}"
          fi

          # A fixed heredoc delimiter (e.g. a literal `TAGS_EOF`) is only safe
          # against $GITHUB_OUTPUT's multiline format if it cannot appear as
          # a standalone line inside the value. RDKIT reaches this step from
          # workflow_dispatch's `rdkit` input; resolve_matrix.sh now rejects
          # anything that isn't ^[0-9]{4}_[0-9]{2}_[0-9]+$ (Ruling 39), which
          # already rules out an embedded newline -- but a random delimiter
          # is cheap belt-and-braces against the same class of bug in any
          # value that ever flows into this heredoc, validated or not.
          delimiter="TAGS_EOF_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          {
            echo "tags<<${delimiter}"
            printf '%s\n' "$tags"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          printf 'Tags:\n%s\n' "$tags"

      - name: Build and push
        if: github.event_name != 'workflow_dispatch' || inputs.push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            debian_version=${{ matrix.entry.debian }}
            postgres_major_version=${{ matrix.entry.postgres_major }}
            postgres_point_version=${{ matrix.entry.postgres_point }}
            postgres_base_image=${{ matrix.entry.postgres_base_image }}
            postgres_base_digest=${{ matrix.entry.postgres_base_digest }}
            rdkit_version=${{ matrix.entry.rdkit }}
            rdkit_core_image=${{ env.CORE_IMAGE }}
            rdkit_pickle_version=${{ steps.labels.outputs.rdkit_pickle_version }}
            rdkit_cartridge_version=${{ steps.labels.outputs.rdkit_cartridge_version }}
            boost_version=${{ steps.labels.outputs.boost_version }}
            vcs_ref=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
