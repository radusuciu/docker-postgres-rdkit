# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# Releases mark changes to this project, not new images, so the changelog is
# built from conventional commits on main between v* tags. The old per-image
# tags (postgres-<point>-rdkit-<rdkit>-<date>) are excluded by tag_pattern.
#
# Usage: `make changelog VERSION=X.Y.Z` (see the Makefile).

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Releases mark changes to this project -- the Dockerfiles, the build matrix in
`versions.json`, the tagging rules and the workflow -- not new images. New
images are published daily whenever PostgreSQL or RDKit ships a release; see
the version table in the README and the GHCR package page for those.\n
"""
# Group names carry a hidden ordering prefix; `striptags` removes it so the
# headings render in Keep a Changelog order rather than alphabetically.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}\
          {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    # Link PR references so they resolve when CHANGELOG.md is read on GitHub.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/radusuciu/docker-postgres-rdkit/pull/${1}))" },
]
commit_parsers = [
    { message = "^feat(\\(.*\\))?!?: (remove|drop) ", group = "<!-- 2 -->Removed" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 3 -->Fixed" },
    { message = "^(refactor|perf|build|ci)", group = "<!-- 1 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^revert", group = "<!-- 5 -->Reverted" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^(chore|style|test)", skip = true },
]
# A breaking `chore!:` must still appear even though chore is skipped.
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]"
topo_order = false
sort_commits = "oldest"
